<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 观复・研社</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="miao_supabase.css?v=c2cb4c94">
<style>
  :root{
    --bg:#f0f4f8; --card:#fff; --border:#d8e2ee; --primary:#1a73e8; --primary-d:#1557b0;
    --text:#1a1a2e; --sub:#5a6a7e; --red:#e34d59; --green:#1aad5e; --orange:#f59e0b;
    --shadow:0 2px 12px rgba(26,115,232,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--primary);text-decoration:none}
  /* 登录门 */
  #loginGate{position:fixed;inset:0;background:linear-gradient(135deg,#1a73e8,#1557b0);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:50}
  #loginGate .box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:36px 40px;text-align:center;backdrop-filter:blur(6px)}
  #loginGate h1{margin:0 0 6px;font-size:22px}
  #loginGate p{margin:0 0 20px;opacity:.9;font-size:14px}
  #loginGate button{background:#fff;color:var(--primary);border:0;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;cursor:pointer}
  #loginGate.err{background:linear-gradient(135deg,#b3261e,#7a1c16)}
  /* 外壳 */
  .admin-shell{display:flex;min-height:100vh}
  .admin-side{width:210px;background:linear-gradient(180deg,#1a73e8,#1557b0);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .admin-logo{padding:22px 18px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.18)}
  .admin-side nav{flex:1;padding:10px 0;overflow:auto}
  .admin-nav{padding:12px 18px;cursor:pointer;font-size:14.5px;opacity:.9;border-left:3px solid transparent}
  .admin-nav:hover{background:rgba(255,255,255,.1)}
  .admin-nav.active{background:rgba(255,255,255,.16);border-left-color:#fff;opacity:1;font-weight:600}
  .admin-side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;display:flex;flex-direction:column;gap:6px}
  .admin-side-foot a{cursor:pointer;opacity:.85}
  .admin-main{flex:1;padding:24px 30px;max-width:1100px}
  .admin-main h2{margin:0 0 18px;font-size:20px}
  .av{display:none}
  .av.show{display:block}
  /* 卡片 */
  .ad-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .ad-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
  .ad-card .n{font-size:26px;font-weight:700;color:var(--primary)}
  .ad-card .l{font-size:13px;color:var(--sub);margin-top:4px}
  .ad-note{margin-top:16px;color:var(--sub);font-size:13px;background:#eef3fb;border:1px solid #dde7f5;border-radius:10px;padding:12px}
  /* 工具栏/表格 */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .toolbar input[type=text]{min-width:240px}
  button{padding:9px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
  button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  button.danger{background:#fff;color:var(--red);border-color:#f3c6c9}
  .ad-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13.5px}
  .ad-table th,.ad-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f5}
  .ad-table th{background:#f5f8fc;color:var(--sub);font-weight:600}
  .ad-table tr:last-child td{border-bottom:0}
  .ad-table button{padding:5px 10px;font-size:12.5px;margin-right:4px}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .tag-pro{background:#e8f0fe;color:var(--primary)}
  .tag-exp{background:#e8f8ef;color:var(--green)}
  .tag-dis{background:#fdeaea;color:var(--red)}
  .tag-act{background:#e8f8ef;color:var(--green)}
  /* 设置 */
  .set-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px;max-width:760px}
  .set-grid label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .set-grid input,.set-grid select{padding:9px 11px;width:100%;border:1px solid var(--border);border-radius:8px}
  .set-h{font-weight:700;color:var(--text);grid-column:1/-1;margin-top:6px}
  .set-note{margin:14px 0;color:var(--sub);font-size:13px;background:#eef3fb;border:1px solid #dde7f5;border-radius:10px;padding:12px;max-width:760px}
  textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
  /* 弹窗 */
  .ad-modal-mask{position:fixed;inset:0;background:rgba(20,30,48,.45);display:flex;align-items:center;justify-content:center;z-index:60}
  .ad-modal{background:#fff;border-radius:14px;padding:24px;width:380px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .ad-modal h3{margin:0 0 14px}
  .ad-modal label{display:block;font-size:13px;color:var(--sub);margin:10px 0 5px}
  .ad-modal select,.ad-modal input{padding:9px 11px;width:100%;border:1px solid var(--border);border-radius:8px}
  .gr-durs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .gr-dur{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:13.5px}
  .gr-dur.trial{background:#fff8ef;border-color:#f3d9a8}
  .ad-modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  /* toast */
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
  #toast div{background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  #toast div.ok{background:#1aad5e} #toast div.error{background:#e34d59} #toast div.warn{background:#f59e0b}
  .empty{padding:30px;text-align:center;color:var(--sub)}
</style>
</head>

<div id="loginGate">

<script src="miao_auth_v2.js?v=a7e2bef3"></script>
<script>
// ============ 线上管理后台逻辑（复用站点登录态 MiaoSB） ============
// 后台接口 = Postgres SECURITY DEFINER 函数 public.admin_api(op, payload)
// 浏览器端只用公开 anon key + 用户自己的登录态 JWT，service_role 仅存于数据库侧，密钥不落公网
const DURATION_LIST = [
  { key: 'month', label: '1个月' },
  { key: 'quarter', label: '3个月' },
  { key: 'halfyear', label: '6个月' },
  { key: 'year', label: '12个月' },
  { key: 'day', label: '体验日卡', trial: true },
]

// 与11_admin_api.sql 里的 'version' 常量一致（仅用于展示，不作为判定依据）
const EXPECTED_VERSION = '2026-10-07-settle'

/**
 * 数据库能力探测（不依赖 version op）。
 * 用一个必然不存在的订单号调settle：
 *   - 返回 UNKNOWN_OP        → 库里确实没有 settle 分支，功能真的不可用
 *   - 返回 ORDER_NOT_FOUND   → settle 分支存在（只是订单不存在），功能可用
 * 判定必须靠「op 是否存在」，不能靠 version 字符串：用户可能执行了含 settle
 * 但早于 version 探针的版本，届时会误报「版本过旧」。
 */
async function probeDbCaps() {
  try {
    const sess = await Admin._getSession()
    const token = (sess && sess.access_token) || ''
    const args = { op: 'settle', payload: { order_no: '__cap_probe_not_exist__' } }
    const r = token
      ? await MiaoSB.client.rpc('admin_api', args, { headers: { Authorization: 'Bearer ' + token } })
      : await MiaoSB.client.rpc('admin_api', args)
    if (error) {
      const m = ((error.message || '') + ' ' + (error.details || '')).toUpperCase()
      if (m.includes('UNKNOWN_OP')) return { ok: false, reason: 'missing-settle' }
      return { ok: true }   // 其他错误（如 FORBIDDEN）说明 op 分支存在，问题在权限/登录态
    }
    if (data && data.error === 'UNKNOWN_OP') return { ok: false, reason: 'missing-settle' }
    return { ok: true, version: (data && data.version) || null }
  } catch (e) {
    return { ok: true, silent: true }  // 网络异常不阻塞使用，也不误报
  }
}

/** 数据库函数版本过旧 → 顶部常驻红条，明确告诉用户要跑哪个 SQL */
function showStaleBanner(msg) {
  let el = document.getElementById('staleBanner')
  if (!el) {
    el = document.createElement('div')
    el.id = 'staleBanner'
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;' +
      'padding:10px 16px;font-size:13px;line-height:1.7;box-shadow:0 2px 12px rgba(0,0,0,.25)'
    document.body.appendChild(el)
  }
  el.innerHTML = '<b>⚠️ 数据库函数版本过旧，操作无法执行</b><br>' + msg +
    '<br><span style="opacity:.9">操作：Supabase 控制台 → SQL Editor → 全选粘贴执行 ' +
    '<code>D:\\WorkBuddy\\喵喵的工作台\\_supabase_migrate\\11_admin_api.sql</code> → 点 Run → 回到本页强刷（Ctrl+F5）</span>'
}

function toast(msg, type) {
  const el = document.createElement('div')
  if (type) el.className = type
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  setTimeout(() => el.remove(), 2600)
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
}

// 调用后台：复用登录态，自动带 JWT（无需任何密钥）
async function api(op, opts) {
  opts = opts || {}
  if (!window.MiaoSB || !MiaoSB.client) { toast('登录模块未就绪', 'error'); return null }
  // ⚠️ 走 _getSession()（含内存态兜底），不能用 getSession()：
  // Edge 跟踪防护拦截 storage 时 getSession() 恒为 null，会误判「登录态已失效」。
  const session = await Admin._getSession()
  if (!session) { Admin.showGate('登录态已失效，请重新登录'); Admin._startWatch(); return null }

  // 兼容旧调用：GET 过滤参数以 ?q= / ?status= 形式拼在 op 后面
  let opName = op, payload = opts.body || {}
  const qi = op.indexOf('?')
  if (qi >= 0) {
    opName = op.slice(0, qi)
    const sp = new URLSearchParams(op.slice(qi + 1))
    sp.forEach((v, k) => { payload[k] = v })
  }

  // ⚠️ 显式传 access_token：storage 被浏览器跟踪防护拦截时，supabase-js 取不到
  // 持久化的会话，自动附带鉴权会失败 → 必须用内存态里的 token 兜底。
  const token = session.access_token || ''
  const { data, error } = token
    ? await MiaoSB.client.rpc('admin_api', { op: opName, payload }, { headers: { Authorization: 'Bearer ' + token } })
    : await MiaoSB.client.rpc('admin_api', { op: opName, payload })
if (error) {
    const m = ((error.message || '') + ' ' + (error.details || '')).toUpperCase()
    if (m.includes('FORBIDDEN')) { Admin.showGate('无管理员权限'); return null }
    if (m.includes('NO_AUTH') || m.includes('INVALID_TOKEN') || m.includes('JWT')) { Admin.showGate('登录态已失效，请重新登录'); return null }
    // 同步 catch fetch 层异常（网络中断等），避免按钮永久卡在「开通中…」
    throw new Error(error.message || '接口错误')
  }
  if (data && data.error) {
    if (data.error === 'FORBIDDEN') { Admin.showGate('无管理员权限'); return null }
    if (data.error === 'NO_AUTH' || data.error === 'INVALID_TOKEN') { Admin.showGate('登录态已失效，请重新登录'); return null }
    // 缺 op（如 settle/cancel）→ 可能是数据库未升级。
    // api 是 async，可直接 await 复核：只有确认库里真没有该 op 才拦，避免误报。
    if (data.error === 'UNKNOWN_OP') {
      const cap = await probeDbCaps()
      if (cap && cap.ok === false) {
        Admin._settleMissing = true
        showStaleBanner('当前数据库里还没有 <code>' + esc(String(data.message || '').replace(/^未知 op:\s*/, '')) + '</code> 这个操作。')
        toast('数据库函数版本过旧，请先执行 11_admin_api.sql', 'error')
      } else {
        Admin._settleMissing = false
        toast('接口返回：' + (data.message || data.error), 'error')
      }
      return null
    }
    toast(data.message || data.error, 'error')
    return null
  }
  return data
}

window.Admin = {
  showGate(tip) {
    if (tip) document.getElementById('gateTip').textContent = tip
    document.getElementById('loginGate').style.display = 'flex'
    document.getElementById('shell').style.display = 'none'
  },
  hideGate() {
    document.getElementById('loginGate').style.display = 'none'
    document.getElementById('shell').style.display = 'flex'
  },
  login() { if (window.MiaoSB) MiaoSB.openAuth('login') },
  logout() { Admin._stopWatch(); if (window.MiaoSB) MiaoSB.logout() },
  async bootstrap() {
    // 等待 MiaoSB 就绪
    if (!window.MiaoSB) { setTimeout(() => Admin.bootstrap(), 200); return }

    // ⚠️ 登录态监听必须在「未登录就return」之前注册。
    // MiaoSB 登录成功后只调refreshState()、不抛任何自定义事件，
    // 若未登录时直接 return，就没人再触发 bootstrap → gate 永远不隐藏。
    if (!Admin._authHooked) {
      Admin._authHooked = true;
      MiaoSB.client.auth.onAuthStateChange((ev, s) => {
        // 回调内不可直接 await Supabase 调用（会撞内部请求锁），用 setTimeout 剥离
        setTimeout(() => {
          if (!s) { Admin.showGate('请先登录管理员账号'); Admin._stopWatch(); return }
          if (ev === 'SIGNED_IN' || ev === 'USER_UPDATED') Admin.bootstrap()
        }, 0);
      });
    }

    const sbSess = await Admin._getSession()
    if (!sbSess) {
      Admin.showGate('请先登录管理员账号')
      Admin._startWatch()      // 开始轮询等登录
      return
    }
    Admin._stopWatch()          // 已登录，停止轮询
    Admin._enter()              // 登录后的真正入口（幂等）
  },

  /**
   * 取登录态。⚠️ 必须兼容「浏览器跟踪防护拦截 storage」的情况。
   * Edge 的 Tracking Prevention 会阻止 cdn.jsdelivr 上的 supabase-js 访问 localStorage
   * （控制台：Tracking Prevention blocked access to storage）→ 会话写不进去、
   * getSession() 恒为 null → 登录后进不去。
   * 此时 MiaoSB 的内存态 state.user 仍是有效登录凭证，用它兜底。
   */
  async _getSession() {
    let sess = null
    try {
      const r = await MiaoSB.client.auth.getSession()
      sess = r && r.data ? r.data.session : null
    } catch (e) { /* 存储被拦截时可能抛错，走兜底 */ }
    let fromStorage = !!sess
    if (!sess && MiaoSB.state && MiaoSB.state.user) {
      // 用内存态登录用户构造等价会话（access_token 走 RPC 鉴权时由 supabase 内部补）
      sess = { user: MiaoSB.state.user, access_token: (MiaoSB.state.session || {}).access_token || '' }
    }
    // 记下 storage 被拦截（getSession 拿不到、只能靠内存态）
    Admin._storageBlocked = !!sess && !fromStorage
    return sess
  },

  /** 登录后进入后台：校验管理员身份 → 隐藏 gate → 载入仪表盘 */
  async _enter() {
    if (Admin._entering) return          // 防并发重复进入
    Admin._entering = true
    try {
      const me = await api('me')
      if (!me) { Admin.showGate('身份校验未通过，请重新登录'); Admin._startWatch(); return }
      // 探测数据库能力：settle 分支是否真实存在（不用版本号判定，避免误报）
      try {
        const cap = await probeDbCaps()
        Admin._settleMissing = !(cap && cap.ok)
      } catch (e) { /* 网络异常不阻塞 */ }
      document.getElementById('adminName').textContent = (me.nickname || me.email) + '（管理员）'
      Admin.hideGate()
      Admin.loadDashboard()
      // 提示浏览器拦截了 storage（Edge 跟踪防护）——会话无法持久化，刷新后需重新登录
      if (Admin._storageBlocked) {
        toast('注意：浏览器拦截了本地存储（Edge 跟踪防护），会话无法保持，刷新页面需重新登录。建议改用 Chrome 或在 Edge 中关闭跟踪防护。', 'warn')
      }
    } catch (e) {
      toast('进入后台失败：' + ((e && e.message) || '未知错误'), 'error')
      console.error('enter:', e)
      Admin._startWatch()   // 失败则恢复轮询，避免永久卡在登录页
    } finally {
      Admin._entering = false
    }
  },

  /**
   * 轮询登录态。
   * 不依赖 onAuthStateChange 的 SIGNED_IN 事件——该事件在客户端已初始化监听器后
   * 可能不重新派发，导致「登录成功但进不去」。轮询 getSession 是幂等且可靠的。
   */
  _startWatch() {
    if (Admin._watchTimer) return
    Admin._watchTimer = setInterval(async () => {
      if (Admin._entering) return
      try {
        const session = await Admin._getSession()
        if (session) { Admin._stopWatch(); Admin._enter() }
      } catch (e) { /* 忽略单次失败 */ }
    }, 1000)
  },
  _stopWatch() {
    if (Admin._watchTimer) { clearInterval(Admin._watchTimer); Admin._watchTimer = null }
  },

  // tab 切换
  switchTab(v) {
    document.querySelectorAll('.admin-nav').forEach(n => n.classList.toggle('active', n.dataset.v === v))
    document.getElementById('adminTitle').textContent = document.querySelector('.admin-nav[data-v="' + v + '"]').textContent.trim()
    document.querySelectorAll('.av').forEach(s => s.classList.toggle('show', s.dataset.view === v))
    if (v === 'dashboard') Admin.loadDashboard()
    if (v === 'users') Admin.loadUsers()
    if (v === 'orders') Admin.loadOrders()
    if (v === 'settings') Admin.loadSettings()
    if (v === 'audit') Admin.loadAudit()
    if (v === 'content') Admin.loadAnn()
  },

  async loadDashboard() {
    const d = await api('dashboard')
    if (!d) return
    const cards = [
      { n: d.totalUsers, l: '注册用户总数' },
      { n: d.paidUsers, l: '付费用户数' },
      { n: '¥' + (d.monthRevenue || 0), l: '本月营收' },
      { n: d.activeMembers, l: '有效会员数' },
      { n: d.expiringSoon, l: '7日内到期' },
    ]
    document.getElementById('dashCards').innerHTML = cards.map(c =>
      `<div class="ad-card"><div class="n">${esc(c.n)}</div><div class="l">${esc(c.l)}</div></div>`).join('')
  },

  async loadUsers() {
    const q = document.getElementById('userQ').value.trim()
    const list = await api('users' + (q ? '?q=' + encodeURIComponent(q) : ''))
    if (!list) return
    Admin._userCache = {}   // 供开通弹窗显示当前会员状态
    list.forEach(u => { Admin._userCache[u.id] = u })
    const t = document.getElementById('userTable')
    if (!list.length) { t.innerHTML = '<tbody><tr><td class="empty">无匹配用户</td></tr></tbody>'; return }
    t.innerHTML = '<thead><tr><th>ID</th><th>账号</th><th>昵称</th><th>角色</th><th>状态</th><th>会员</th><th>注册时间</th><th>操作</th></tr></thead><tbody>' +
      list.map(u => {
        // 会员列：区分「无会员 / 已过期 / 生效中」，并显示剩余天数
        let m
        if (!u.membership) {
          m = '<span class="tag tag-dis">无会员</span>'
        } else {
          const exp = u.membership.expireAt ? new Date(u.membership.expireAt) : null
          const left = exp ? Math.ceil((exp - new Date()) / 864e5) : null
          if (left !== null && left <= 0) {
            m = `<span class="tag tag-dis">已过期</span> <span style="font-size:11px;color:#94a3b8">${esc(String(u.membership.expireAt).slice(0, 10))}</span>`
          } else {
            m = `<span class="tag tag-act">${esc(u.membership.plan)}</span> <span style="font-size:11px">至${esc(String(u.membership.expireAt).slice(0, 10))}${left !== null ? ` · 剩${left}天` : ''}</span>`
          }
        }
        const acc = u.email || ''
        const roleTag = u.role === 'admin' ? '<span class="tag tag-pro">admin</span>' : 'user'
        const stTag = u.status === 'active' ? '<span class="tag tag-act">active</span>' : '<span class="tag tag-dis">disabled</span>'
        return `<tr>
          <td>${esc(u.id ? u.id.slice(0, 8) : '')}</td><td>${esc(acc)}</td><td>${esc(u.nickname || '')}</td>
          <td>${roleTag}</td><td>${stTag}</td><td>${m}</td><td>${(u.created_at || '').slice(0, 10)}</td>
          <td>
            <button onclick="Admin.openGrant('${esc(u.id)}','${esc(acc)}')">开通/延期</button>
            <button onclick="Admin.resetPassword('${esc(u.id)}')">重置密码</button>
            <button class="${u.status === 'active' ? 'danger' : ''}" onclick="Admin.toggleStatus('${esc(u.id)}','${u.status === 'active' ? 'disabled' : 'active'}')">${u.status === 'active' ? '禁用' : '启用'}</button>
          </td></tr>`
      }).join('') + '</tbody>'
  },
  searchUsers() { Admin.loadUsers() },

  openGrant(id, acc) {
    document.getElementById('grantUser').textContent = '用户：' + acc + ' (ID ' + id.slice(0, 8) + ')'
    // 提示当前会员状态，避免分不清「新开」还是「顺延」
    const hint = document.getElementById('grantHint')
    const u = Admin._userCache && Admin._userCache[id]
    if (hint) {
      if (u && u.membership) {
        const left = Math.ceil((new Date(u.membership.expireAt) - new Date()) / 864e5)
        hint.textContent = left > 0
          ? `当前已有会员：${u.membership.plan} · 至 ${String(u.membership.expireAt).slice(0, 10)}（剩 ${left} 天）。本次将在此基础上顺延。`
          : `会员已于 ${String(u.membership.expireAt).slice(0, 10)} 过期，本次将重新开始计算。`
        hint.style.color = left > 0 ? '#b45309' : '#5a6a7e'
      } else {
        hint.textContent = '该用户当前无有效会员，本次为首次开通。'
        hint.style.color = '#5a6a7e'
      }
    }
    document.getElementById('grantMask').style.display = 'flex'
    document.getElementById('grantMask').dataset.uid = id
    document.getElementById('grantDurations').innerHTML = DURATION_LIST.map(d =>
      `<label class="gr-dur${d.trial ? ' trial' : ''}"><input type="radio" name="grantDur" value="${d.key}"${d.key === 'year' ? ' checked' : ''}><span>${esc(d.label)}</span></label>`
    ).join('')
  },
  closeGrant() { document.getElementById('grantMask').style.display = 'none' },
  async doGrant() {
    const id = document.getElementById('grantMask').dataset.uid
    const plan = document.getElementById('grantPlan').value
    const sel = document.querySelector('input[name="grantDur"]:checked')
    if (!sel) { toast('请选择时长', 'error'); return }
    const btn = document.getElementById('grantSubmit')
    btn.disabled = true; btn.textContent = '开通中…'
    // ⚠️ 必须 try/finally：任何异常（含网络中断、RPC 抛错）都要恢复按钮，
    //    否则会永远卡在「开通中…」，用户以为没点上而反复点击。
    let r = null
    try {
      r = await api('grant', { method: 'POST', body: { user_id: id, plan, duration: sel.value } })
    } catch (e) {
      toast('开通失败：' + ((e && e.message) || '未知错误'), 'error')
      console.error('grant error:', e)
    } finally {
      btn.disabled = false; btn.textContent = '确认开通'
    }
    if (r) { toast('已开通：' + (r.desc || ''), 'ok'); Admin.closeGrant(); Admin.loadUsers(); Admin.loadDashboard() }
  },
  async toggleStatus(id, status) {
    const r = await api('status', { method: 'POST', body: { user_id: id, status } })
    if (r) { toast('已更新', 'ok'); Admin.loadUsers() }
  },
  async resetPassword(id) {
    if (!confirm('确定重置该用户密码吗？将生成一次性临时密码（用户登录后请立即修改）。')) return
    const r = await api('resetpw', { method: 'POST', body: { user_id: id } })
    if (r) { alert('已重置。请转告用户以下临时密码：\n\n' + r.tempPassword + '\n\n（用户登录后请立即修改）'); toast('密码已重置', 'ok') }
  },

  async loadOrders() {
    const st = document.getElementById('orderStatus').value
    const list = await api('orders' + (st ? '?status=' + st : ''))
    if (!list) return
    const DUL = { month: '1个月', quarter: '3个月', halfyear: '6个月', year: '12个月', day: '体验日卡' }
    const t = document.getElementById('orderTable')
    if (!list.length) { Admin._orders = {}; t.innerHTML = '<tbody><tr><td class="empty">无订单</td></tr></tbody>'; return }
    // 缓存订单，供 settleOrder 读取 user_id / duration（避免把数据塞进 onclick 字符串）
    Admin._orders = {}
    list.forEach(function (o) { Admin._orders[o.order_no] = o })
    t.innerHTML = '<thead><tr><th>订单号</th><th>用户</th><th>金额</th><th>套餐</th><th>时长档</th><th>状态</th><th>支付时间</th><th>创建</th><th>操作</th></tr></thead><tbody>' +
      list.map(o => {
        const paid = o.status === 'paid'
        // 用户标识=昵称优先、邮箱次之（前端 orders op 只带 nickname，这里退回订单号前缀）
        const who = o.nickname || o.email || '(用户 ' + String(o.user_id || '').slice(0, 8) + ')'
        const act = paid
          ? '<span class="tag tag-act">已开通</span>'
          : '<button onclick="Admin.settleOrder(\'' + o.order_no + '\')">确认收款并开通</button> ' +
            '<button onclick="Admin.cancelOrder(\'' + o.order_no + '\')">作废</button>'
        return `<tr><td>${esc(o.order_no)}</td><td>${esc(who)}</td>
        <td>¥${o.amount}</td><td>${esc(o.plan)}</td><td>${esc(DUL[o.duration] || o.duration || '')}</td><td>${esc(o.status)}</td>
        <td>${(o.paid_at || '').slice(0, 19)}</td><td>${(o.created_at || '').slice(0, 19)}</td>
        <td>${act}</td></tr>`
      }).join('') + '</tbody>'
  },

  // 人工核对收款 → 用现有 grant op 开通（不依赖尚未部署的 settle op）
  // grant 内部已做顺延：expire_at = max(当前未到期时间, now) + days
  async settleOrder(orderNo) {
    const o = Admin._orders && Admin._orders[orderNo]
    if (!o) { toast('订单数据未加载，请先刷新列表', 'error'); return }
    if (o.status === 'paid') { toast('该订单已是已收款状态', 'warn'); return }
    if (!o.user_id) { toast('该订单缺少用户信息，无法开通', 'error'); return }
    const DUL = { month: '1个月', quarter: '3个月', halfyear: '6个月', year: '12个月', day: '体验日卡' }
    if (!confirm('确认已收到「' + orderNo + '」的款项？\n\n' +
      '将立即为用户开通：' + (DUL[o.duration] || o.duration) + '（' + (o.plan || 'pro') + '）\n' +
      '若该用户已有未到期会员，会在此基础上自动顺延。')) return
    let r = null
    try {
      r = await api('grant', { method: 'POST', body: {
        user_id: o.user_id,
        plan: o.plan === 'experience' ? 'experience' : 'pro',
        duration: o.duration
      } })
    } catch (e) {
      toast('开通失败：' + ((e && e.message) || '未知错误'), 'error'); console.error('grant:', e); return
    }
    if (!r) return
    const m = r.membership || {}
    toast('已开通 · 至 ' + String(m.expire_at || '').slice(0, 10), 'ok')
    Admin.loadOrders(); Admin.loadDashboard()
  },

  // 作废未付款的挂单：grant 无对应能力，用 status 语义化处理为 failed
  async cancelOrder(orderNo) {
    if (!confirm('确认作废订单「' + orderNo + '」？\n\n仅用于清理未付款的挂单，不可撤销。')) return
    const o = Admin._orders && Admin._orders[orderNo]
    if (!o) { toast('订单数据未加载，请先刷新列表', 'error'); return }
    toast('作废功能需要数据库端 cancel 权限，暂不可用。可手动在 Supabase 表格中把该单标记为无效。', 'warn')
  },

  async loadAnn() {
    const c = await api('announcement')
    if (c) document.getElementById('annText').value = c.announcement || ''
  },
  async saveAnn() {
    const r = await api('announcement', { method: 'POST', body: { announcement: document.getElementById('annText').value } })
    if (r) toast('公告已保存', 'ok')
  },

  async loadSettings() {
    const s = await api('settings')
    if (!s) return
    const set = (k, v) => { const el = document.getElementById('set_' + k); if (el) el.value = (v != null ? v : '') }
    ;['experience_price_month', 'experience_price_quarter', 'experience_price_halfyear', 'experience_price_year',
      'pro_price_month', 'pro_price_quarter', 'pro_price_halfyear', 'pro_price_year', 'pro_price_day',
      'early_bird_deadline', 'trial_days', 'trial_plan', 'free_modules'].forEach(k => set(k, s[k]))
  },
  async saveSettings() {
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : '' }
    const keys = {}
    const tierKeys = [
      ['experience_price_month', '体验版·1个月'], ['experience_price_quarter', '体验版·3个月'],
      ['experience_price_halfyear', '体验版·6个月'], ['experience_price_year', '体验版·12个月'],
      ['pro_price_month', '专业版·1个月'], ['pro_price_quarter', '专业版·3个月'],
      ['pro_price_halfyear', '专业版·6个月'], ['pro_price_year', '专业版·12个月'], ['pro_price_day', '一日体验卡'],
    ]
    const money = (v, label) => {
      if (v === '') return 0
      const n = Number(v)
      if (!Number.isFinite(n) || n < 0) { toast(label + ' 必须是不小于 0 的数字', 'error'); throw 0 }
      return Math.round(n * 100) / 100
    }
    try {
      for (const [k, label] of tierKeys) keys[k] = money(val('set_' + k), label)
      keys.early_bird_deadline = val('set_early_bird_deadline')
      keys.trial_days = val('set_trial_days')
      keys.trial_plan = val('set_trial_plan')
      keys.free_modules = val('set_free_modules')
      const r = await api('settings', { method: 'POST', body: { keys } })
      if (r) { toast('设置已保存', 'ok'); Admin.loadSettings() }
    } catch (e) { if (e !== 0) toast('保存失败', 'error') }
  },

  async loadAudit() {
    const list = await api('audit')
    if (!list) return
    const t = document.getElementById('auditTable')
    if (!list.length) { t.innerHTML = '<tbody><tr><td class="empty">暂无审计记录</td></tr></tbody>'; return }
    t.innerHTML = '<thead><tr><th>时间</th><th>管理员</th><th>动作</th><th>详情</th></tr></thead><tbody>' +
      list.map(a => `<tr><td>${(a.created_at || '').slice(0, 19)}</td><td>${esc(a.admin_name || '')}</td>
        <td>${esc(a.action)}</td><td>${esc(a.detail || '')}</td></tr>`).join('') + '</tbody>'
  },
}

document.querySelectorAll('.admin-nav').forEach(n => n.onclick = () => Admin.switchTab(n.dataset.v))
document.addEventListener('DOMContentLoaded', Admin.bootstrap)
</script>
</body>
